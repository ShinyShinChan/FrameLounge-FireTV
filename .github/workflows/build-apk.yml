name: Build Fire TV APK
on:
  push:
    branches: [main]
    paths-ignore:
      - framextv-catalog.json
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check public project for accidentally embedded keys
        run: python3 scripts/check_public_safe.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare optional persistent signing identity
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAME_LOUNGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FRAME_LOUNGE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/framelounge-signing.p12"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'No permanent signing identity provided. Building test-only debug APK.'
          else
            echo 'Signing setup incomplete. Both secrets must be set.' >&2
            exit 1
          fi
      - name: Build installable APK
        env:
          FRAME_LOUNGE_KEYSTORE_PATH: ${{ runner.temp }}/framelounge-signing.p12
          FRAME_LOUNGE_KEYSTORE_PASSWORD: ${{ secrets.FRAME_LOUNGE_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = 'true' ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk FrameLounge-FireTV.apk
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo 'Releases require your permanent signing secrets so updates keep app data.' >&2
              exit 1
            fi
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk FrameLounge-FireTV.apk
          fi
      - name: Upload installable APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLounge-FireTV-APK
          path: FrameLounge-FireTV.apk
          retention-days: 90
      - name: Create public GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FrameLounge-FireTV.apk --verify-tag --title "Frame Lounge $GITHUB_REF_NAME" --notes "Sideload this Fire OS APK. Personal TMDB credentials stay on the device. Use the same signing identity for all updates."
