name: Refresh FrameXTV Listings
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect listed movie and TV links (no stream checks)
        run: python3 scripts/update_framextv_catalog.py
      - name: Publish changed listings
        run: |
          if git diff --quiet -- framextv-catalog.json; then
            echo 'No catalog changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add framextv-catalog.json
          git commit -m 'Refresh listed FrameXTV titles'
          git push
