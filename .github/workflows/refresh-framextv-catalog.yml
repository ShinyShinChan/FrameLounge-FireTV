name: Refresh FrameXTV Listings
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser used for JavaScript-rendered FrameXTV listings
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect published FrameXTV titles (no video stream testing)
        run: python3 scripts/update_framextv_catalog.py
      - name: Publish refreshed catalog to the public repository
        run: |
          if git diff --quiet -- framextv-catalog.json && git diff --quiet -- framextv-crawl-progress.json && test -z "$(git ls-files --others --exclude-standard framextv-crawl-progress.json)"; then
            echo 'No catalog changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add framextv-catalog.json framextv-crawl-progress.json
          git commit -m 'Expand FrameXTV catalog via resumable browse discovery'
          git push
